name: Deploy to cPanel

# After CI passes on main (or when started by hand): cPanel pulls main and runs
# .cpanel.yml (copy files, npm install --omit=dev, restart), then the job waits
# until /health answers from a freshly started process. All of it is in
# deploy/cpanel-trigger.sh. Steps and secrets: docs/DEPLOY_AUTO.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a running deploy is never cancelled.
concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: deploy
      # cPanel always pulls the CURRENT main, so deploy only when that commit
      # is the one CI passed: after a CI run, main must not have moved on (the
      # newer commit gets its own deploy); by hand, main's CI must be green.
      - name: Check that main is the commit CI passed
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            if [ "$main_sha" != "$TESTED_SHA" ]; then
              echo "::notice::Skipped: main moved on after this CI run; the newer commit is deployed by its own run."
              echo "go=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            ci=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${main_sha}&per_page=1" --jq '.workflow_runs[0].conclusion // "none"')
            if [ "$ci" != "success" ]; then
              echo "::error::Not deployed: CI for the current main (${main_sha:0:7}) is '${ci}', not success."
              exit 1
            fi
          fi
          echo "Deploying main ${main_sha:0:7}."
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: Deploy through the cPanel API
        if: steps.guard.outputs.go == 'true'
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://mi3aad.com/health' }}
        run: bash deploy/cpanel-trigger.sh
